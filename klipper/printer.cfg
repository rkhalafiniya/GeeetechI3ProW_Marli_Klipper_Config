[include mainsail.cfg]
# =========================
# MCU / Printer core
# =========================
[mcu]
# CHANGE THIS to match your setup:
# Find with:  ls /dev/serial/by-id/*
serial: /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
baud: 250000   # Marlin BAUDRATE 250000

[printer]
kinematics: cartesian
max_velocity: 300       # Marlin MAX_FEEDRATE X/Y = 300 mm/s
max_accel: 3000         # Marlin DEFAULT_MAX_ACCELERATION X/Y = 3000
max_z_velocity: 5       # Marlin MAX_FEEDRATE Z = 5
max_z_accel: 100        # Marlin DEFAULT_MAX_ACCELERATION Z = 100
square_corner_velocity: 5.0   # From Marlin jerk (X/Y 10 mm/s) – tune later

# =========================
# Steppers
# =========================
# Marlin steps/mm: { 82.05, 81.22, 400, 93 }
# rotation_distance = (200 * 16) / steps_per_mm

[stepper_x]
step_pin: PA3
dir_pin: !PA1          # May need "!" depending on actual direction (see note)
enable_pin: !PA5
microsteps: 16
rotation_distance: 39.00061   # From 82.05 steps/mm
endstop_pin: ^PA0             # X_MIN
position_endstop: 0
position_min: 0
position_max: 200             # X_BED_SIZE
homing_speed: 40

[stepper_y]
step_pin: PC6
dir_pin: !PC4          # May need "!" depending on actual direction
enable_pin: !PA7
microsteps: 16
rotation_distance: 39.39916   # From 81.22 steps/mm
endstop_pin: ^PA4             # Y_MIN
position_endstop: 0
position_min: 0
position_max: 200             # Y_BED_SIZE
homing_speed: 40

[stepper_z]
step_pin: PC0
dir_pin: PG2        # Generic GT2560 config uses "!" here
enable_pin: !PC2
microsteps: 16
rotation_distance: 8.0        # From 400 steps/mm (leadscrew)
endstop_pin: probe:z_virtual_endstop   # Use BLTouch instead of mechanical Z
position_min: -4
position_max: 200             # Z_MAX_POS 200
homing_speed: 10

# =========================
# Extruder
# =========================
[extruder]
step_pin: PL6
dir_pin: !PL4         # May need "!" depending on actual direction
enable_pin: !PG0
microsteps: 16
rotation_distance: 34.4086    # From 93 steps/mm
nozzle_diameter: 0.4
filament_diameter: 1.75       # DEFAULT_NOMINAL_FILAMENT_DIA

heater_pin: PE4
sensor_type: EPCOS 100K B57560G104F  # Marlin TEMP_SENSOR_0 = 1
sensor_pin: PK0
min_temp: 5                 # HEATER_0_MINTEMP
max_temp: 275               # HEATER_0_MAXTEMP

# Marlin PID: Kp 22.20 / Ki 1.08 / Kd 114.00
control: pid
pid_kp: 22.287
pid_ki: 0.530
pid_kd: 193.998

pressure_advance: 0.0       # Start at 0, tune later

# =========================
# Heated bed
# =========================
[heater_bed]
heater_pin: PG5
sensor_type: EPCOS 100K B57560G104F  # TEMP_SENSOR_BED = 1
sensor_pin: PK2
min_temp: 5                 # BED_MINTEMP
max_temp: 150               # BED_MAXTEMP

# Marlin bed PID: 10.00 / 0.023 / 305.4
control: pid
pid_kp: 10.00
pid_ki: 0.023
pid_kd: 305.4

# =========================
# Fans
# =========================
[fan]
pin: PH4   # Part cooling fan (from generic GT2560)

# If you have a separate hotend fan on another pin, add:
# [heater_fan hotend_fan]
# pin: <pin>
# heater: extruder
# max_power: 1.0
# kick_start_time: 0.5
# temperature: 50.0

# =========================
# BLTouch (on Z-min)
# =========================
[bltouch]
sensor_pin: ^PC7      # Z_MIN on GT2560, Marlin Z_MIN_PROBE_USES_Z_MIN_ENDSTOP_PIN
control_pin: PC5      # Servo header on GT2560 Rev A+:contentReference[oaicite:2]{index=2}

# From NOZZLE_TO_PROBE_OFFSET { 10, 10, -1 }
x_offset: 5
y_offset: -45
# z_offset must be calibrated with PROBE_CALIBRATE:
#z_offset: 0.0

speed: 5
samples: 1
sample_retract_dist: 5
probe_with_touch_mode: True

# =========================
# Bed mesh (Marlin ABL bilinear)
# =========================
[bed_mesh]
speed: 120
#mesh_min: 20,20         # Safe inner area; adjust if needed
#mesh_max: 180,180       # Within 200x200 bed
mesh_min: 20, 10
mesh_max: 190, 140
probe_count: 3,3
algorithm: bicubic
fade_start: 1.0
fade_end: 10.0

# =========================
# Safe Z homing (like Marlin Z_SAFE_HOMING)
# =========================
[safe_z_home]
home_xy_position: 100,100   # Center of 200x200 bed
speed: 50
z_hop: 10
z_hop_speed: 5

# =========================
# Endstops
# =========================
[force_move]
enable_force_move: True

# Endstop logic:
# Marlin: X/Y/Z_MIN_ENDSTOP_HIT_STATE HIGH and ENDSTOPPULLUPS set.
# In Klipper we use pullups (^) and invert if needed (!) as in pins above.

# =========================
# Display (HD44780-style 20x4 on GT2560)
# =========================
[display]
lcd_type: hd44780
rs_pin: PD1
e_pin: PH0
d4_pin: PH1
d5_pin: PD0
d6_pin: PE3
d7_pin: PH3
encoder_pins: ^PL7, ^PG1
click_pin: ^!PD2

# =========================
# Input shaping / extras can be added later
# =========================

# Example virtual SD if you want:
# [virtual_sdcard]
# path: ~/printer_data/gcodes

